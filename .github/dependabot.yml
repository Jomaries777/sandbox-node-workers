# Dependabot (spec §4.7). Weekly on Monday, one grouped PR per ecosystem.
# Security updates are not grouped here, so each one arrives on its own PR.
# Bootstrap appends the chosen stack's entries (npm / pip / gomod, docker)
# from stacks/<stack>/dependabot-updates.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
  # Node stack (spec FR-7). Bootstrap appends these entries to the `updates:`
  # list in .github/dependabot.yml, then deletes this file.
  # npm: patch updates share one PR, which the bot approves and auto-merges
  # once ci-ok passes; minor updates share another, which waits for the owner;
  # major updates arrive one per PR and also wait. Proven in the sandbox
  # (sandbox-node-local #6 and #7).
  - package-ecosystem: npm
    directory: /stacks/node
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-patch:
        update-types:
          - patch
      npm-minor:
        update-types:
          - minor
  # The Dockerfile's base image (node:<major>-slim). Each update is its own PR
  # and waits for the owner unless it is a patch.
  - package-ecosystem: docker
    directory: /stacks/node
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
  # cloudflare-workers adapter: the wrangler pinned in this folder's lockfile.
  # Bootstrap appends these entries to the `updates:` list in
  # .github/dependabot.yml only when the project's target is
  # cloudflare-workers, so other projects get no wrangler PRs. A project that
  # switches to this target later adds them by hand (plan.md Deviations).
  - package-ecosystem: npm
    directory: /deploy/targets/cloudflare-workers
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      wrangler-patch:
        update-types:
          - patch
      wrangler-minor:
        update-types:
          - minor
